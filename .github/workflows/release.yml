name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Note: this repository contains TWO packages:
#   ./luci-theme-shadcnui          — the theme itself (PKGARCH=all)
#   ./luci-app-shadcnui-config     — the config UI (PKGARCH=all)
#
# Both are PKGARCH=all so a single SDK run produces .apk packages that work
# on every OpenWrt 25.12 target. We pick rockchip/armv8 only because the SDK
# has to come from somewhere; the resulting all-arch packages are identical
# regardless of the SDK target chosen.

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # required by softprops/action-gh-release to create the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rockchip-armv8
            sdk_url: https://downloads.openwrt.org/releases/25.12.2/targets/rockchip/armv8/openwrt-sdk-25.12.2-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache file g++ gawk gettext git \
            libelf-dev libncurses-dev libssl-dev \
            python3 python3-setuptools python3-dev python3-venv \
            rsync subversion swig time xsltproc zlib1g-dev zstd unzip wget curl
          # OpenWrt's prereq scan looks for the system pyelftools module.
          # Noble's apt package is fine but pip --break-system-packages is
          # the most reliable cross-version path.
          sudo pip3 install --break-system-packages pyelftools

      - name: Download SDK
        run: |
          mkdir -p /tmp/sdk && cd /tmp/sdk
          curl -fsSL -o sdk.tar.zst "${{ matrix.sdk_url }}"
          tar --use-compress-program=unzstd -xf sdk.tar.zst
          mv openwrt-sdk-* sdk
          ls sdk/

      - name: Stage packages into SDK feed
        run: |
          SDK=/tmp/sdk/sdk
          mkdir -p "$SDK/package/luci-theme-shadcnui"
          mkdir -p "$SDK/package/luci-app-shadcnui-config"
          cp -a luci-theme-shadcnui/.       "$SDK/package/luci-theme-shadcnui/"
          cp -a luci-app-shadcnui-config/.  "$SDK/package/luci-app-shadcnui-config/"

      - name: Update + install LuCI feed
        working-directory: /tmp/sdk/sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        working-directory: /tmp/sdk/sdk
        run: |
          # Start from defconfig, then strip every CONFIG_PACKAGE_*=y line.
          # The SDK's prereq pass would otherwise try to satisfy build deps
          # for u-boot, kernel modules, etc. — none of which our pure-LuCI
          # all-arch packages need. We re-add only our two packages as 'm'.
          make defconfig
          sed -i '/^CONFIG_PACKAGE_.*=y$/d' .config
          {
            echo 'CONFIG_PACKAGE_luci-theme-shadcnui=m'
            echo 'CONFIG_PACKAGE_luci-app-shadcnui-config=m'
          } >> .config
          make defconfig

          echo "===== effective .config (luci/our pkgs only) ====="
          grep -E '^CONFIG_PACKAGE_(luci-|shadcnui)' .config || true

      - name: Build packages
        working-directory: /tmp/sdk/sdk
        run: |
          make package/luci-theme-shadcnui/compile      V=s -j$(nproc)
          make package/luci-app-shadcnui-config/compile V=s -j$(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find /tmp/sdk/sdk/bin -type f \( -name '*.apk' -o -name '*.ipk' \) \
            \( -name 'luci-theme-shadcnui*' -o -name 'luci-app-shadcnui-config*' \) \
            -exec cp -v {} artifacts/ \;
          ls -la artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: artifacts/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
